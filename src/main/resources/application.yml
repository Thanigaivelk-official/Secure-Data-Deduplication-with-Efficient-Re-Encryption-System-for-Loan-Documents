spring:
  application:
    name: secure-loan-deduplication
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}

# Security & Cryptography Configuration
app:
  security:
    # 256-bit (32 bytes) master secret reference encoded in Base64 (Overridden via env MASTER_KEY_SECRET in production)
    master-key-secret: ${MASTER_KEY_SECRET:u6B1Z7p4W8k3N9x2L5v8R1t4Y7q0W3e6B9m2P5z8K1v=}
    tenant-id: ${APP_TENANT_ID:DEFAULT_BANK_TENANT}
  storage:
    local:
      base-dir: ${STORAGE_PATH:./storage/encrypted}
      allowed-extensions: pdf,jpg,jpeg,png,doc,docx
      max-file-size-bytes: 26214400 # 25MB

server:
  port: ${PORT:8080}

logging:
  level:
    com.example.loandocs: INFO
    org.springframework.security: WARN

---
# Local profile (Default out-of-the-box profile using embedded H2 in MySQL-compatibility mode)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./storage/loan_dedup_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

---
# MySQL Production / Staging Profile (Activated with --spring.profiles.active=mysql)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:loan_dedup_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
