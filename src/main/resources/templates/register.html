<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - Secure Loan Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --gradient-bg: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #042f2e 100%);
        }
        body {
            background: var(--gradient-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(85px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb-1 { width: 360px; height: 360px; background: #0d9488; top: -60px; left: -80px; }
        .orb-2 { width: 380px; height: 380px; background: #2563eb; bottom: -80px; right: -80px; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .card-auth {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .card-auth:hover { transform: translateY(-3px); }

        .auth-header {
            background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
            padding: 30px 24px;
            color: #ffffff;
            text-align: center;
        }
        .icon-reg {
            font-size: 2.8rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .card-auth:hover .icon-reg { transform: scale(1.1); }

        .form-control {
            border-radius: 12px;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.15);
        }
        .btn-register {
            background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(13, 148, 136, 0.35);
        }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card card-auth animate__animated animate__fadeInUp">
    <div class="auth-header">
        <i class="bi bi-person-badge-fill icon-reg mb-2"></i>
        <h4 class="fw-bold mb-1">Create Customer Account</h4>
        <small class="opacity-80">Join Secure Loan Document Cloud</small>
    </div>
    <div class="card-body p-4">
        <div id="alertMsg" class="alert d-none animate__animated animate__fadeIn" role="alert"></div>

        <form id="regForm">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" id="fullName" class="form-control rounded-end-3" placeholder="David Miller" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-at text-muted"></i></span>
                    <input type="text" id="username" class="form-control rounded-end-3" placeholder="david_miller" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" id="email" class="form-control rounded-end-3" placeholder="david@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-shield-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control rounded-end-3" placeholder="At least 6 characters" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-register w-100 text-white mt-2">
                <i class="bi bi-check2-circle me-1"></i> Register Account
            </button>
        </form>

        <div class="text-center mt-3 small text-muted">
            Already have an account? <a th:href="@{/login}" class="text-info text-decoration-none fw-bold">Sign in</a>
        </div>
    </div>
</div>

<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertMsg');
    const payload = {
        fullName: document.getElementById('fullName').value,
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
            alertBox.className = 'alert alert-success animate__animated animate__fadeIn';
            alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> ' + data.message;
            alertBox.classList.remove('d-none');
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            alertBox.className = 'alert alert-danger animate__animated animate__shakeX';
            alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> ' + (data.message || 'Registration failed');
            alertBox.classList.remove('d-none');
        }
    } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Server connection error';
        alertBox.classList.remove('d-none');
    }
});
</script>

</body>
</html>
